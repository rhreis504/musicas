<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><title>Meu Violão</title><style>
html,body{margin:0;width:100%;height:100%;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#08101f}
#force{position:fixed;z-index:99999;right:12px;top:calc(12px + env(safe-area-inset-top));border:1px solid #f59e0b;background:#111a2ef2;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;box-shadow:0 4px 18px #0008}
#force:active{filter:brightness(1.12)}
#force.pending{border-color:#f59e0b;color:#fbbf24;animation:updatePulse 1.05s ease-in-out infinite}
#force.ready{border-color:#22c55e;color:#86efac;box-shadow:0 0 18px #22c55e55}
#force.ok{border-color:#22c55e;color:#86efac}
#force.error{border-color:#ef4444;color:#fecaca}
@keyframes updatePulse{50%{opacity:.55;box-shadow:0 0 22px #f59e0b66}}
</style></head><body><button id="force">↻ Atualizar</button><script>
(()=>{
 const btn=document.getElementById("force"),APP="app-5.9.html";
 let frame=null,loadedVersion=null,available=null,timer=null;
 const bust=()=>Date.now()+"-"+Math.random().toString(36).slice(2);
 const setState=(kind,text)=>{btn.className=kind;btn.textContent=text;btn.setAttribute("aria-label",text)};
 async function get(url){const sep=url.includes("?")?"&":"?";const r=await fetch(url+sep+"v="+bust(),{cache:"no-store",headers:{"Cache-Control":"no-cache"}});if(!r.ok)throw Error("HTTP "+r.status);return r.text()}
 function versionOf(html){return (html.match(/const CURRENT="([^"]+)"/)||[])[1]||null}
 function mount(url,version){
   const n=document.createElement("iframe");n.allow="microphone; autoplay";n.src=url;
   n.onload=()=>{if(frame)frame.remove();frame=n;loadedVersion=version||versionOf(n.contentDocument?.documentElement?.innerHTML||"")||loadedVersion};
   document.body.appendChild(n);
 }
 async function check(){
   try{
     // A própria página publicada é a fonte de verdade. Não depende mais de manifesto/raw GitHub.
     const html=await get("./"+APP),published=versionOf(html);
     if(!published)throw Error("versão ausente");
     available={version:published};
     if(!loadedVersion){
       const shown=frame?.contentDocument?.querySelector("#appVersionBadge")?.textContent||"";
       loadedVersion=(shown.match(/([0-9]+\.[0-9]+)/)||[])[1]||null;
     }
     if(published!==loadedVersion)setState("ready","● Nova v"+published+" publicada — atualizar aplicativo");
     else setState("","↻ Atualizar");
   }catch(err){setState("error","⚠ Verificar atualização")}
 }
 btn.onclick=async()=>{
   if(btn.classList.contains("ready")&&available){
     setState("ok","Atualizando para v"+available.version+"…");
     mount("./"+APP+"?version="+encodeURIComponent(available.version)+"&fresh="+bust(),available.version);
     setTimeout(check,1800);return;
   }
   setState("","Verificando…");await check();
 };
 mount("./"+APP+"?boot="+bust(),null);
 setTimeout(check,900);
 timer=setInterval(check,30000);
 if("serviceWorker" in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(x=>x.unregister())).catch(()=>{});
 if("caches" in window)caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).catch(()=>{});
})();
</script></body></html>
