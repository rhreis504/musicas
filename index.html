<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><title>Meu Violão</title><style>
html,body{margin:0;width:100%;height:100%;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#08101f}
#boot{position:fixed;z-index:100000;inset:0;display:flex;align-items:center;justify-content:center;background:#08101f;padding:28px}
#box{width:min(520px,90vw);text-align:center}.guitar{font-size:58px;display:inline-block;animation:play .42s ease-in-out infinite alternate;transform-origin:70% 70%}
@keyframes play{to{transform:rotate(-9deg) scale(1.06)}}h1{font-size:25px;margin:14px 0 6px}#status{color:#b9c4d8;font-weight:700;min-height:24px}
.track{height:18px;border:1px solid #435675;border-radius:999px;background:#111a2e;overflow:hidden;margin-top:20px}
#bar{height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#facc15);transition:width .22s ease}
#pct{margin-top:8px;font-size:14px;font-weight:900;color:#fbbf24}
#retry{display:none;margin:18px auto 0;border:1px solid #f59e0b;background:#111a2e;color:#fff;border-radius:999px;padding:10px 16px;font-weight:800}
</style></head><body>
<div id="boot"><div id="box"><div class="guitar">🎸</div><h1>Meu Violão</h1><div id="status">Preparando atualização…</div><div class="track"><div id="bar"></div></div><div id="pct">0%</div><button id="retry">Tentar novamente</button></div></div>
<script>
(()=>{
 const APP="app-5.9.html",RAW="https://raw.githubusercontent.com/rhreis504/musicas/main/",boot=document.getElementById("boot"),status=document.getElementById("status"),bar=document.getElementById("bar"),pct=document.getElementById("pct"),retry=document.getElementById("retry");
 const bust=()=>Date.now()+"-"+Math.random().toString(36).slice(2);
 const progress=(n,t)=>{bar.style.width=n+"%";pct.textContent=n+"%";if(t)status.textContent=t};
 const versionOf=h=>(h.match(/const CURRENT="([^"]+)"/)||[])[1]||null;
 const manifestVersion=md=>{const m=md.match(/- \*\*version:\*\*\s*([^\s]+)/i);return m?m[1]:null};
 async function get(url){const r=await fetch(url+(url.includes("?")?"&":"?")+"fresh="+bust(),{cache:"no-store",headers:{"Cache-Control":"no-cache, no-store, must-revalidate","Pragma":"no-cache"}});if(!r.ok)throw Error("HTTP "+r.status);return r.text()}
 async function purge(){
   progress(8,"Limpando cache…");
   try{if("serviceWorker" in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.unregister()))}}catch(e){}
   try{if("caches" in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
   progress(20,"Cache limpo");
 }
 async function waitForPublished(){
   progress(30,"Verificando versão mais recente no GitHub…");
   const md=await get(RAW+"ATUALIZACAO.md"),wanted=manifestVersion(md);
   if(!wanted)throw Error("manifesto sem versão");
   let tries=0;
   while(true){
     tries++;
     try{
       const html=await get("./"+APP),published=versionOf(html);
       if(published===wanted){progress(70,"v"+wanted+" publicada no GitHub Pages");return {html,version:wanted}}
       const p=35+Math.min(30,tries*2);
       progress(p,"v"+wanted+" ainda publicando no GitHub… aguardando");
     }catch(e){progress(35,"Aguardando publicação da v"+wanted+"…")}
     await new Promise(ok=>setTimeout(ok,5000));
   }
 }
 async function start(){
   retry.style.display="none";
   try{
     await purge();
     const fresh=await waitForPublished();
     progress(78,"Baixando v"+fresh.version+" sem cache…");
     const finalHtml=await get("./"+APP);
     if(versionOf(finalHtml)!==fresh.version)throw Error("publicação mudou durante download");
     progress(86,"Preparando v"+fresh.version+"…");
     const frame=document.createElement("iframe");frame.allow="microphone; autoplay";frame.src="./"+APP+"?version="+encodeURIComponent(fresh.version)+"&session="+bust();frame.style.visibility="hidden";
     frame.onload=()=>{progress(94,"Finalizando v"+fresh.version+"…");setTimeout(()=>{progress(100,"v"+fresh.version+" atualizada");setTimeout(()=>{frame.style.visibility="visible";requestAnimationFrame(()=>boot.remove())},280)},220)};
     document.body.appendChild(frame);
   }catch(e){progress(0,"Não foi possível verificar a atualização.");retry.style.display="block"}
 }
 retry.onclick=start;start();
})();
</script></body></html>
