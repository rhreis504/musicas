<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Meu Violão</title><style>
html,body{margin:0;width:100%;height:100%;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#08101f}
#boot{position:fixed;z-index:100000;inset:0;display:flex;align-items:center;justify-content:center;background:#08101f;padding:28px}
#box{width:min(520px,90vw);text-align:center}.guitar{font-size:58px;display:inline-block;animation:play .42s ease-in-out infinite alternate;transform-origin:70% 70%}
@keyframes play{to{transform:rotate(-9deg) scale(1.06)}}h1{font-size:25px;margin:14px 0 6px}#status{color:#b9c4d8;font-weight:700;min-height:24px}
.track{height:18px;border:1px solid #435675;border-radius:999px;background:#111a2e;overflow:hidden;margin-top:20px}
#bar{height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#facc15);transition:width .22s ease}
#pct{margin-top:8px;font-size:14px;font-weight:900;color:#fbbf24}
#retry{display:none;margin:18px auto 0;border:1px solid #f59e0b;background:#111a2e;color:#fff;border-radius:999px;padding:10px 16px;font-weight:800}
</style></head><body>
<div id="boot"><div id="box"><div class="guitar">🎸</div><h1>Meu Violão</h1><div id="status">Preparando atualização…</div><div class="track"><div id="bar"></div></div><div id="pct">0%</div><button id="retry">Tentar novamente</button></div></div>
<script>
(()=>{
 try{if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{})}catch(e){}
 const REQUIRED_VERSION="5.39",APP="./app-5.9.html",boot=document.getElementById("boot"),status=document.getElementById("status"),bar=document.getElementById("bar"),pct=document.getElementById("pct"),retry=document.getElementById("retry");
 const bust=()=>Date.now()+"-"+Math.random().toString(36).slice(2),progress=(n,t)=>{bar.style.width=n+"%";pct.textContent=n+"%";if(t)status.textContent=t};
 const versionOf=h=>(h.match(/const CURRENT="([^"]+)"/)||[])[1]||"atual",sleep=ms=>new Promise(r=>setTimeout(r,ms));
 async function purge(){progress(10,"Limpando cache…");try{if("serviceWorker"in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.unregister()))}}catch(e){}try{if("caches"in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}progress(25,"Cache limpo")}
 async function findPublished(){progress(38,"Verificando atualização publicada…");let last=null;for(let n=0;n<36;n++){try{const u=APP+"?fresh="+bust(),r=await fetch(u,{cache:"no-store"});if(r.ok){const h=await r.text(),v=versionOf(h);if((h.includes("<html")||h.includes("<!doctype"))&&v===REQUIRED_VERSION){progress(70,"Versão v"+v+" publicada");return {v,u}}last=Error("Aguardando v"+REQUIRED_VERSION+"; encontrada v"+v)}last=Error("HTTP "+r.status)}catch(e){last=e}progress(Math.min(65,40+n),"Aguardando publicação no GitHub…");await sleep(5000)}throw last||Error("indisponível")}
 async function start(){retry.style.display="none";try{await purge();const f=await findPublished();progress(82,"Abrindo v"+f.v+"…");const frame=document.createElement("iframe");frame.allow="microphone; autoplay";frame.style.visibility="hidden";frame.src=f.u;let done=false,t=setTimeout(()=>{if(!done){frame.remove();progress(0,"Demora ao abrir. Tente novamente.");retry.style.display="block"}},20000);frame.addEventListener("load",()=>{if(done)return;done=true;clearTimeout(t);progress(100,"v"+f.v+" pronta");setTimeout(()=>{frame.style.visibility="visible";boot.remove()},250)},{once:true});document.body.appendChild(frame)}catch(e){progress(0,"Sem conexão com a versão publicada.");retry.style.display="block"}}
 retry.onclick=start;start();
})();
</script></body></html>
