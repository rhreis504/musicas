<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><title>Meu Violão</title><style>html,body{margin:0;width:100%;height:100%;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center}iframe{border:0;width:100%;height:100%;display:block;background:#08101f}</style></head><body><div id="boot">🎸 Meu Violão<br><small>Verificando atualização…</small></div><script>(()=>{let v="",f,b=false;async function c(){if(b)return;b=true;try{let r=await fetch("./version.json?t="+Date.now(),{cache:"no-store"}),m=await r.json();if(m.version&&m.version!==v){let n=document.createElement("iframe");n.allow="microphone; autoplay";n.src="./app-"+m.version+".html?build="+encodeURIComponent(m.build||m.version);n.onload=()=>{document.getElementById("boot")?.remove();if(f)f.remove();f=n};document.body.appendChild(n);v=m.version}}catch(e){}finally{b=false}}c();setInterval(c,60000);addEventListener("focus",c);addEventListener("pageshow",c);document.addEventListener("visibilitychange",()=>{if(!document.hidden)c()})})();</script></body></html>
