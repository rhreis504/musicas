<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><title>Meu Violão</title><style>
html,body{margin:0;width:100%;height:100%;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#08101f}
#force{position:fixed;z-index:99999;right:12px;top:calc(12px + env(safe-area-inset-top));border:1px solid #f59e0b;background:#111a2ef2;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;box-shadow:0 4px 18px #0008}
#force:active{background:#f59e0b;color:#111}
</style></head><body><button id="force">↻ Atualizar</button><script>
(()=>{
 const btn=document.getElementById("force"),LOCAL_VERSION="5.19",LOCAL_BUILD="755cc7d3",APP="app-5.9.html";
 let frame=null,busy=false;
 const bust=()=>Date.now()+"-"+Math.random().toString(36).slice(2);
 function parseMD(md){
   const version=(md.match(/\*\*version:\*\*\s*([^\s]+)/i)||[])[1];
   const build=(md.match(/\*\*build:\*\*\s*([^\s]+)/i)||[])[1];
   const entry=(md.match(/\*\*entry:\*\*\s*([^\s]+)/i)||[])[1]||APP;
   if(!version||!build)throw Error("ATUALIZACAO.md inválido");
   return {version,build,app:entry};
 }
 async function mdLatest(){
   const r=await fetch("./ATUALIZACAO.md?fresh="+bust(),{cache:"no-store",headers:{"Cache-Control":"no-cache, no-store, max-age=0","Pragma":"no-cache"}});
   if(!r.ok)throw Error("ATUALIZACAO.md indisponível");
   return parseMD(await r.text());
 }
 function appUrl(m){return "./"+m.app+"?version="+encodeURIComponent(m.version)+"&build="+encodeURIComponent(m.build)+"&fresh="+bust()}
 function mount(m){
   const n=document.createElement("iframe");n.allow="microphone; autoplay";n.src=appUrl(m);
   n.onload=()=>{if(frame)frame.remove();frame=n};
   document.body.appendChild(n);
 }
 async function purge(){
   if("serviceWorker" in navigator){for(const reg of await navigator.serviceWorker.getRegistrations())await reg.unregister().catch(()=>{})}
   if("caches" in window){for(const key of await caches.keys())await caches.delete(key)}
   try{localStorage.removeItem("mv-last-manifest")}catch(e){}
 }
 async function hardUpdate(){
   if(busy)return;busy=true;btn.textContent="Validando versão…";
   try{
     await purge();
     const m=await mdLatest();
     btn.textContent="Abrindo v"+m.version+"…";
     const u=new URL(location.origin+location.pathname);
     u.searchParams.set("version",m.version);u.searchParams.set("build",m.build);u.searchParams.set("fresh",bust());
     location.replace(u.href);
   }catch(e){btn.textContent="Falha — tentar novamente";busy=false}
 }
 btn.onclick=hardUpdate;
 mount({version:LOCAL_VERSION,build:LOCAL_BUILD,app:APP});
 setTimeout(async()=>{try{const m=await mdLatest();if(m.version!==LOCAL_VERSION||m.build!==LOCAL_BUILD){await purge();mount(m)}}catch(e){}},250);
})();
</script></body></html>
