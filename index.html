<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><title>Meu Violão</title><style>
html,body{margin:0;width:100%;height:100%;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#08101f}
#force{position:fixed;z-index:99999;right:12px;top:calc(12px + env(safe-area-inset-top));border:1px solid #f59e0b;background:#111a2ef2;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;box-shadow:0 4px 18px #0008}
#force:active{filter:brightness(1.12)}
#force.pending{border-color:#f59e0b;color:#fbbf24;animation:updatePulse 1.05s ease-in-out infinite}
#force.ready{border-color:#22c55e;color:#86efac;box-shadow:0 0 18px #22c55e55}
#force.ok{border-color:#22c55e;color:#86efac}
#force.error{border-color:#ef4444;color:#fecaca}
@keyframes updatePulse{50%{opacity:.55;box-shadow:0 0 22px #f59e0b66}}
</style></head><body><button id="force">↻ Atualizar</button><script>
(()=>{
 const btn=document.getElementById("force"),APP="app-5.9.html",raw="https://raw.githubusercontent.com/rhreis504/musicas/main/";
 let frame=null,busy=false,pendingTimer=null,pendingSince=0,lastManifest=null;
 const bust=()=>Date.now()+"-"+Math.random().toString(36).slice(2);
 const setState=(kind,text)=>{btn.className=kind;btn.textContent=text;btn.setAttribute("aria-label",text)};
 function parseMD(md){
  const value=key=>{const row=md.split("\n").find(x=>x.toLowerCase().includes("**"+key+":**"));return row?row.split("**").pop().trim().split(" ")[0]:null};
  const version=value("version"),build=value("build"),entry=value("entry")||APP;
  if(!version||!build||!entry.endsWith(".html"))throw Error("Manifesto inválido");
  return {version,build,entry};
 }
 async function get(url){const r=await fetch(url+(url.includes("?")?"&":"?")+"fresh="+bust(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return r.text()}
 async function manifest(){try{return parseMD(await get(raw+"ATUALIZACAO.md"))}catch(e){return parseMD(await get("./ATUALIZACAO.md"))}}
 async function htmlFor(m,rawFirst=true){
  const marker='const CURRENT="'+m.version+'"',sources=rawFirst?[raw+m.entry,"./"+m.entry]:["./"+m.entry,raw+m.entry];
  for(const u of sources){try{const h=await get(u);if(h.includes(marker))return h}catch(e){}}
  return null;
 }
 function mount(html,m){
  const n=document.createElement("iframe");n.allow="microphone; autoplay";n.srcdoc=html;
  n.onload=()=>{if(frame)frame.remove();frame=n;setState("ok","✓ v"+m.version+" instalada");setTimeout(()=>setState("","↻ Atualizar"),3000)};
  document.body.appendChild(n);
 }
 function startPending(m){
  lastManifest=m;if(!pendingSince)pendingSince=Date.now();
  clearInterval(pendingTimer);
  const paint=()=>{const sec=Math.floor((Date.now()-pendingSince)/1000);setState("pending","● v"+m.version+" publicando · "+sec+"s")};paint();
  pendingTimer=setInterval(async()=>{paint();const h=await htmlFor(m,false);if(h){clearInterval(pendingTimer);pendingTimer=null;pendingSince=0;setState("ready","● v"+m.version+" pronta — atualizar")}},5000);
 }
 async function check(autoLoad){
  if(busy)return;busy=true;setState("pending","Consultando GitHub…");
  try{
   const m=await manifest();lastManifest=m;
   const pageHtml=await htmlFor(m,false);
   if(pageHtml){
    setState("ready","● v"+m.version+" pronta — atualizar");
    if(autoLoad)mount(pageHtml,m);
   }else{
    // Raw já anuncia a versão, mas Pages ainda não a entregou: mantém o app atual e acompanha sem bloquear.
    const rawHtml=await htmlFor(m,true);
    if(rawHtml)startPending(m);else setState("error","Falha ao localizar v"+m.version+" — tentar");
   }
  }catch(e){setState("error","Falha ao consultar — tentar");console.warn("Atualização Meu Violão:",e)}
  finally{busy=false}
 }
 btn.onclick=async()=>{
  if(btn.classList.contains("ready")&&lastManifest){const h=await htmlFor(lastManifest,false);if(h){mount(h,lastManifest);return}}
  check(true);
 };
 // Abre imediatamente o app disponível no Pages; a checagem de versão ocorre por cima, sem tela vazia.
 (async()=>{try{const h=await get("./"+APP);const m=(h.match(/const CURRENT="([^"]+)"/)||[])[1]||"atual";mount(h,{version:m});}catch(e){}check(false)})();
})();
</script></body></html>
