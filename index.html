<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><title>Meu Violão</title><style>
html,body{margin:0;width:100%;height:100%;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#08101f}
#force{position:fixed;z-index:99999;right:12px;top:calc(12px + env(safe-area-inset-top));border:1px solid #f59e0b;background:#111a2ef2;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;box-shadow:0 4px 18px #0008}
#force:active{background:#f59e0b;color:#111}
</style></head><body><button id="force">↻ Atualizar</button><script>
(()=>{
 const btn=document.getElementById("force"),LOCAL_VERSION="5.22",APP="app-5.9.html";
 const raw="https://raw.githubusercontent.com/rhreis504/musicas/main/";
 let frame=null,busy=false;
 const bust=()=>Date.now()+"-"+Math.random().toString(36).slice(2);
 const status=t=>{btn.textContent=t;btn.setAttribute("aria-label",t)};
 function parseMD(md){
  const version=(md.match(/\\*\\*version:\\*\\*\\s*([^\\s]+)/i)||[])[1];
  const build=(md.match(/\\*\\*build:\\*\\*\\s*([^\\s]+)/i)||[])[1];
  const entry=(md.match(/\\*\\*entry:\\*\\*\\s*([^\\s]+)/i)||[])[1]||APP;
  if(!version||!build||!/^[\\w.-]+\\.html$/.test(entry))throw Error("Manifesto inválido");
  return {version,build,entry};
 }
 async function fetchText(path,fromRaw){
  const url=(fromRaw?raw:"./")+path+(path.includes("?")?"&":"?")+"fresh="+bust();
  const res=await fetch(url,{cache:"no-store"});
  if(!res.ok)throw Error("HTTP "+res.status);
  return res.text();
 }
 async function manifest(){
  try{return parseMD(await fetchText("ATUALIZACAO.md",true))}
  catch(e){return parseMD(await fetchText("ATUALIZACAO.md",false))}
 }
 async function verifiedHtml(m){
  const marker='const CURRENT="'+m.version+'"';
  for(const fromRaw of [true,false]){
   try{
    const html=await fetchText(m.entry,fromRaw);
    if(html.includes(marker))return html;
   }catch(e){}
  }
  throw Error("A versão "+m.version+" ainda não está disponível para carregar");
 }
 function mount(html,m){
  const n=document.createElement("iframe");
  n.allow="microphone; autoplay";
  n.srcdoc=html;
  n.onload=()=>{if(frame)frame.remove();frame=n;status("✓ v"+m.version+" instalada");setTimeout(()=>status("↻ Atualizar"),3200)};
  document.body.appendChild(n);
 }
 async function refresh(){
  if(busy)return;busy=true;status("Consultando GitHub…");
  try{
   const m=await manifest();
   status("Verificando v"+m.version+"…");
   const html=await verifiedHtml(m);
   mount(html,m);
  }catch(e){
   status("Aguardando publicação — tente em 2 min");
   console.warn("Atualização Meu Violão:",e);
  }finally{busy=false}
 }
 btn.onclick=refresh;
 refresh();
})();
</script></body></html>
