<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><title>Meu Violão</title><style>html,body{margin:0;width:100%;height:100%;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center}iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#08101f}</style></head><body><div id="boot">🎸 Meu Violão<br><small>Abrindo…</small></div><script>
(()=>{let f=null,v="",busy=false;
function show(src,ver){const n=document.createElement("iframe");n.allow="microphone; autoplay";n.src=src;n.onload=()=>{document.getElementById("boot")?.remove();if(f)f.remove();f=n;v=ver||v};document.body.appendChild(n)}
function timeout(ms){return new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))}
async function check(){
 if(busy)return;busy=true;
 try{
  const r=await Promise.race([fetch("https://raw.githubusercontent.com/rhreis504/musicas/main/version.json?t="+Date.now(),{cache:"no-store",mode:"cors"}),timeout(2500)]);
  if(!r.ok)return;const m=await r.json();if(!m.version||m.version===v)return;
  const p="./"+(m.app||("app-"+m.version+".html"))+"?build="+encodeURIComponent(m.build||m.version)+"&t="+Date.now();
  const test=await Promise.race([fetch(p,{cache:"no-store"}),timeout(2500)]);if(!test.ok)return;
  if(!f)show(p,m.version);else{const html=await test.text();if(html.includes("v"+m.version))show(p,m.version)}
 }catch(e){}finally{busy=false}
}
check();
setInterval(check,60000);addEventListener("focus",check);addEventListener("pageshow",check);document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});
})();
</script></body></html>
