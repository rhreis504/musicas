<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><title>Meu Violão</title><style>
html,body{margin:0;width:100%;height:100%;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#08101f}#force{position:fixed;z-index:99999;right:12px;top:calc(12px + env(safe-area-inset-top));border:1px solid #f59e0b;background:#111a2e;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;box-shadow:0 4px 18px #0008}#force:active{background:#f59e0b;color:#111}
</style></head><body><button id="force">↻ Atualizar</button><script>
(()=>{let f=null,key="",busy=false;const btn=document.getElementById("force");
const FALLBACK={version:"5.3",build:"eb69f20",app:"app-5.3.html"};
function url(m,fresh=false){return "./"+m.app+"?build="+encodeURIComponent(m.build||m.version)+(fresh?"&t="+Date.now():"")}
function show(m,fresh=false){const k=m.version+"@"+m.build;if(f&&k===key&&!fresh)return;const n=document.createElement("iframe");n.allow="microphone; autoplay";n.src=url(m,fresh);n.onload=()=>{if(f)f.remove();f=n;key=k;try{localStorage.setItem("mv-last-manifest",JSON.stringify(m))}catch(e){}};document.body.appendChild(n)}
function timeout(ms){return new Promise((_,rej)=>setTimeout(()=>rej(Error("timeout")),ms))}
async function latest(){const r=await Promise.race([fetch("https://raw.githubusercontent.com/rhreis504/musicas/main/version.json?t="+Date.now(),{cache:"no-store",mode:"cors"}),timeout(2200)]);if(!r.ok)throw Error("manifest");return r.json()}
let first=FALLBACK;try{const x=JSON.parse(localStorage.getItem("mv-last-manifest")||"null");if(x&&x.app)first=x}catch(e){}
show(first,false);
async function check(force=false){if(busy)return;busy=true;if(force)btn.textContent="Atualizando…";try{const m=await latest(),k=m.version+"@"+m.build;if(force||k!==key)show(m,true)}catch(e){if(force){btn.textContent="Sem conexão";setTimeout(()=>btn.textContent="↻ Atualizar",1200)}}finally{busy=false;if(force&&btn.textContent==="Atualizando…")setTimeout(()=>btn.textContent="↻ Atualizar",500)}}
setTimeout(()=>check(false),150);btn.onclick=()=>check(true);setInterval(()=>check(false),60000);addEventListener("focus",()=>check(false));document.addEventListener("visibilitychange",()=>{if(!document.hidden)check(false)});
})();
</script></body></html>
