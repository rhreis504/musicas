<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101f"><title>Meu Violão</title><style>
html,body{margin:0;width:100%;height:100%;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#08101f}
#force{position:fixed;z-index:99999;right:12px;top:calc(12px + env(safe-area-inset-top));border:1px solid #f59e0b;background:#111a2ef2;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;box-shadow:0 4px 18px #0008}
#force:active{background:#f59e0b;color:#111}
</style></head><body><button id="force">↻ Atualizar</button><script>
(()=>{let frame=null,currentKey="",busy=false;const btn=document.getElementById("force");
const PUBLISHED={version:"5.10",build:"6b6c2c8a",app:"app-5.9.html"};
const manifestUrl=()=> "https://raw.githubusercontent.com/rhreis504/musicas/main/version.json?nocache="+Date.now();
const appUrl=m=>"./"+m.app+"?build="+encodeURIComponent(m.build||m.version)+"&nocache="+Date.now();
function mount(m){
 const k=m.version+"@"+(m.build||"");
 const n=document.createElement("iframe");n.allow="microphone; autoplay";n.src=appUrl(m);
 n.onload=()=>{if(frame)frame.remove();frame=n;currentKey=k;try{localStorage.setItem("mv-last-manifest",JSON.stringify(m))}catch(e){}};
 document.body.appendChild(n);
}
async function latest(){
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),3500);
 try{const r=await fetch(manifestUrl(),{cache:"no-store",mode:"cors",signal:ctl.signal});if(!r.ok)throw Error("manifest");return await r.json()}finally{clearTimeout(tm)}
}
async function validateApp(m){const u=appUrl(m);const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),4000);try{const r=await fetch(u,{cache:"no-store",signal:ctl.signal});if(!r.ok)throw Error("app");return true}finally{clearTimeout(tm)}}
async function update(force){
 if(busy)return;busy=true;if(force)btn.textContent="Atualizando…";
 try{
   const m=await latest(),k=m.version+"@"+(m.build||"");
   if(force||k!==currentKey){await validateApp(m);mount(m);}
   if(force){btn.textContent="✓ Atualizado";setTimeout(()=>btn.textContent="↻ Atualizar",900)}
 }catch(e){
   if(force){/* Mesmo offline/cacheado, recarrega o build publicado embutido */mount(PUBLISHED);btn.textContent="↻ Recarregado";setTimeout(()=>btn.textContent="↻ Atualizar",900)}
 }finally{busy=false}
}
/* abre imediatamente o build atual; a rede só é usada para descobrir um build ainda mais novo */
mount(PUBLISHED);
setTimeout(()=>update(false),50);
setInterval(()=>update(false),30000);
addEventListener("focus",()=>update(false));
addEventListener("pageshow",()=>update(false));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)update(false)});
btn.onclick=async()=>{try{if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.update().catch(()=>{})}}catch(e){} update(true)};
})();
</script></body></html>
